<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personalized Grocery AI</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }
        .auth-tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: 600;
            color: #64748b;
            border-bottom: 2px solid transparent;
        }
        .auth-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        input, select {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background: var(--primary-dark);
        }
        .hidden { display: none; }
        .switch-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
        }
        .switch-tab {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🛒 Grocery AI</h1>
            <p>Manage your pantry and budget</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" data-auth-mode="login">Login</button>
            <button class="auth-tab" data-auth-mode="register">Register</button>
        </div>

        <div id="loginPanel">
            <form id="loginForm">
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required placeholder="name@example.com"></div>
                <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required placeholder="••••••••"></div>
                <button type="submit">Sign In</button>
            </form>
        </div>

        <div id="registerPanel" class="hidden">
            <form id="registerForm">
                <div class="form-group"><label>Full Name</label><input type="text" id="registerName" required placeholder="John Doe"></div>
                <div class="form-group"><label>Email</label><input type="email" id="registerEmail" required placeholder="name@example.com"></div>
                <div class="form-group"><label>Password</label><input type="password" id="registerPassword" required placeholder="••••••••"></div>
                <div class="form-group"><label>Role</label><select id="registerRole"><option value="User">User</option><option value="Admin">Admin</option></select></div>
                <button type="submit">Create Account</button>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
